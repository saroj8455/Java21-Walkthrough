<div class="mb-4">
  <h1 class="mat-headline-5 mb-1">Transactions</h1>
  @if (overall(); as all) {
    @if (all.firstTransactionAt) {
      <span class="text-muted small">
        {{ all.totalCount }} transactions &middot;
        {{ formatDate(all.firstTransactionAt) }} &ndash; {{ formatDate(all.lastTransactionAt) }}
      </span>
    }
  }
</div>

<div class="row g-3 mb-4">
  <div class="col-12 col-lg-6">
    <app-statement-upload (imported)="onImported($event)" />
  </div>
  <div class="col-12 col-lg-6">
    <mat-card class="h-100">
      <mat-card-header><mat-card-title>Import history</mat-card-title></mat-card-header>
      <mat-card-content class="pt-2">
        <app-import-history [imports]="imports()" />
      </mat-card-content>
    </mat-card>
  </div>
</div>

<mat-card>
  <mat-card-header><mat-card-title>All transactions</mat-card-title></mat-card-header>
  <mat-card-content class="pt-3">
    <!-- 1. filters (write the shared store) -->
    <app-transaction-filters [periods]="periods()" class="d-block mb-3" />
    <!-- 2. KPIs + top counterparties for the SAME filter -->
    <app-transaction-insights [overall]="overall()" class="d-block" />
    <!-- 3. the rows -->
    <app-transaction-table />
  </mat-card-content>
</mat-card>
