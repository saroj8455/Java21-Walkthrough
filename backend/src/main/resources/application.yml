# =====================================================================================
# application.yml  ==  your .env + config module in Node.
# Syntax ${ENV_VAR:default} -> read env var, fall back to default.
# Docker Compose injects the env vars; defaults let you run locally against localhost.
# =====================================================================================
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful            # finish in-flight requests on SIGTERM (docker stop)
  tomcat:
    # Let Tomcat read (and reject cleanly) bodies above the multipart limit instead of resetting the connection.
    max-swallow-size: 10MB

spring:
  application:
    name: walkthrough-api

  # Java 21 virtual threads: each request gets a cheap virtual thread instead of a
  # pooled OS thread. Gives Node-like scalability while keeping simple blocking code.
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/walkthrough}
    username: ${DB_USERNAME:walkthrough}
    password: ${DB_PASSWORD:walkthrough}
    # HikariCP = the connection pool (like pg.Pool). Imports may use at most
    # app.import.max-concurrent-imports of these, so reads always have free connections.
    hikari:
      pool-name: walkthrough-pool
      maximum-pool-size: 10
      connection-timeout: 5000   # ms - fail fast instead of queueing requests forever

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  data:
    web:
      pageable:
        max-page-size: 100       # clients cannot request ?size=1000000

  jpa:
    # validate = Hibernate checks entities match the tables but NEVER changes the schema.
    # Schema changes are owned by Flyway migrations (src/main/resources/db/migration).
    hibernate:
      ddl-auto: validate
    open-in-view: false          # best practice: no lazy DB access from the web layer
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true              # errors as RFC 7807 JSON (type/title/status/detail)

# Our own settings, bound to the ImportProperties record (type-safe config).
app:
  import:
    max-concurrent-imports: ${IMPORT_MAX_CONCURRENT:3}   # bulkhead size
    acquire-timeout: 5s                                  # how long an upload waits for a free slot
    batch-size: 500                                      # rows per JDBC batch insert
    max-rows: 50000                                      # protect memory from huge files

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.walkthrough: DEBUG
    # Uncomment to see SQL generated by Hibernate:
    # org.hibernate.SQL: DEBUG
